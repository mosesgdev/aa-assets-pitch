<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .post {
    width: 1080px;
    height: 1350px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    background: #ffffff;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 40px 44px;
    position: relative;
    z-index: 10;
  }

  .logo img { width: 120px; height: 120px; object-fit: contain; }

  .project-info {
    color: #6b7280;
    text-align: right;
    font-size: 12px;
    line-height: 1.6;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .comparison {
    flex: 1;
    display: flex;
    position: relative;
  }

  .half {
    width: 50%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: flex-end;
  }

  .half img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .half-left img { filter: saturate(0.3) brightness(0.85); }

  .label {
    position: relative;
    z-index: 2;
    padding: 28px 36px;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: #ffffff;
    background: linear-gradient(to top, rgba(10,15,26,0.85), transparent);
    width: 100%;
    padding-top: 80px;
  }

  .divider {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #d4a853;
    transform: translateX(-50%);
    z-index: 5;
  }

  .divider-arrow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 56px;
    height: 56px;
    background: #0a0f1a;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #d4a853;
    font-size: 22px;
    font-weight: bold;
    z-index: 6;
  }
</style>
</head>
<body>
  <div class="post">
    <div class="top-bar">
      <div class="logo"><img src="logo.png" alt="A&A Assets"></div>
      <div class="project-info">Düsseldorf Stadtmitte<br>92 m² · 3 Zimmer</div>
    </div>

    <div class="comparison">
      <div class="half half-left">
        <img src="before.jpg" alt="Vorher">
        <div class="label">Vorher</div>
      </div>

      <div class="divider"></div>
      <div class="divider-arrow">→</div>

      <div class="half">
        <img src="after.jpg" alt="Nachher">
        <div class="label">Nachher</div>
      </div>
    </div>
  </div>
</body>
</html>
