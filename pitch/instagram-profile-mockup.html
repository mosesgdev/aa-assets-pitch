<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #262626;
    display: flex;
    justify-content: center;
    padding: 40px 0;
  }

  .phone {
    width: 430px;
    min-height: 932px;
    background: #ffffff;
    border: 1px solid #dbdbdb;
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 20px 80px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.04);
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px 8px;
    font-size: 15px;
    font-weight: 600;
  }
  .status-bar-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Top nav */
  .top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 16px 10px;
    border-bottom: 1px solid #efefef;
  }
  .top-nav-user {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .top-nav-user svg { width: 14px; height: 14px; margin-top: 2px; }
  .top-nav-icons { display: flex; gap: 20px; }
  .top-nav-icons svg { width: 26px; height: 26px; }

  /* Profile header */
  .profile-header {
    padding: 16px 16px 0;
  }
  .profile-top {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .avatar {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: #ffffff;
    /* Instagram-style gradient ring */
    padding: 3px;
    background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
  }
  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
  }
  .avatar-inner img {
    width: 95%;
    height: 95%;
    object-fit: contain;
  }
  .stats {
    display: flex;
    gap: 0;
    flex: 1;
    justify-content: space-around;
    text-align: center;
  }
  .stat-num {
    font-size: 17px;
    font-weight: 700;
  }
  .stat-label {
    font-size: 13px;
    color: #262626;
    font-weight: 400;
  }

  /* Bio */
  .bio {
    padding: 12px 16px 0;
  }
  .bio-name {
    font-size: 14px;
    font-weight: 700;
  }
  .bio-category {
    font-size: 13px;
    color: #8e8e8e;
    margin-top: 1px;
  }
  .bio-text {
    font-size: 14px;
    line-height: 1.4;
    margin-top: 4px;
    white-space: pre-line;
  }
  .bio-link {
    font-size: 14px;
    font-weight: 600;
    color: #00376b;
    margin-top: 2px;
    display: block;
  }

  /* Action buttons */
  .actions {
    display: flex;
    gap: 6px;
    padding: 14px 16px;
  }
  .btn-follow {
    flex: 1;
    background: #0095f6;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 0;
    text-align: center;
  }
  .btn-message {
    flex: 1;
    background: #efefef;
    color: #262626;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 0;
    text-align: center;
  }
  .btn-contact {
    width: 34px;
    background: #efefef;
    border: none;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-contact svg { width: 16px; height: 16px; }

  /* Story highlights */
  .highlights {
    display: flex;
    gap: 16px;
    padding: 12px 16px;
    overflow-x: auto;
    border-bottom: 1px solid #efefef;
  }
  .highlight {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .highlight-circle {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid #dbdbdb;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafafa;
    font-size: 22px;
  }
  .highlight-label {
    font-size: 12px;
    max-width: 64px;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Tab bar */
  .tab-bar {
    display: flex;
    border-bottom: 1px solid #efefef;
  }
  .tab {
    flex: 1;
    padding: 12px 0;
    display: flex;
    justify-content: center;
  }
  .tab.active {
    border-bottom: 1px solid #262626;
  }
  .tab svg { width: 24px; height: 24px; }
  .tab.inactive svg { color: #8e8e8e; }

  /* Post grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
  }
  .grid-item {
    aspect-ratio: 4/5;
    overflow: hidden;
    position: relative;
    background: #fafafa;
  }
  .grid-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Render templates as grid thumbnails via iframes */
  .grid-item iframe {
    width: 1080px;
    height: 1350px;
    transform-origin: top left;
    transform: scale(0.1327); /* 143.33px / 1080px */
    border: none;
    pointer-events: none;
  }

  /* Bottom nav */
  .bottom-nav {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px 0 28px;
    border-top: 1px solid #efefef;
    background: #fff;
  }
  .bottom-nav svg { width: 26px; height: 26px; }
  .bottom-nav-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid #262626;
    overflow: hidden;
    background: #fafafa;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bottom-nav-avatar img { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>

</body>
