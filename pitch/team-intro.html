<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .post {
    width: 1080px;
    height: 1350px;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    flex-direction: column;
  }

  .photo-area { height: 55%; position: relative; overflow: hidden; }
  .photo-area img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .photo-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 36px 44px;
    background: linear-gradient(to top, rgba(10,15,26,0.9), transparent);
  }
  .role { font-size: 10px; text-transform: uppercase; letter-spacing: 0.3em; color: #d4a853; font-weight: 700; margin-bottom: 8px; }
  .name { font-family: 'Instrument Serif', serif; font-size: 40px; color: #ffffff; line-height: 1.1; }

  .content { flex: 1; padding: 44px; display: flex; flex-direction: column; justify-content: center; }
  .quote-mark { font-family: 'Instrument Serif', serif; font-size: 80px; color: #0a0f1a; opacity: 0.06; line-height: 0.6; margin-bottom: 16px; }
  .bio { font-size: 17px; color: #6b7280; line-height: 1.7; margin-bottom: 32px; }
  .divider { width: 40px; height: 2px; background: #d4a853; margin-bottom: 24px; }
  .fact-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.25em; color: #6b7280; margin-bottom: 4px; }
  .fact-value { font-size: 15px; color: #0a0f1a; font-weight: 600; margin-bottom: 16px; }

  .bottom-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 44px 40px; }
  .logo img { width: 120px; height: 120px; object-fit: contain; }

  /* Gold accent at dividing point */
  .gold-line { width: 100%; height: 3px; background: #d4a853; }
</style>
</head>
<body>
  <div class="post">
    <div class="photo-area">
      <img src="anton.png" alt="Anton Berbassov">
      <div class="photo-overlay">
        <div class="role">Gründer & Geschäftsführer</div>
        <div class="name">Anton Berbassov</div>
      </div>
    </div>
    <div class="gold-line"></div>
    <div class="content">
      <div class="quote-mark">&ldquo;</div>
      <div class="bio">Unsere Mission ist es, traumhaften Wohnraum in NRW zu schaffen. Wir verwandeln sanierungsbedürftige Immobilien in Traumzuhause — mit Qualität und Leidenschaft.</div>
      <div class="divider"></div>
      <div class="fact-label">Unternehmen</div>
      <div class="fact-value">A&A Assets GmbH</div>
      <div class="fact-label">Standort</div>
      <div class="fact-value">Leverkusen, NRW</div>
      <div class="fact-label">Fokus</div>
      <div class="fact-value">Immobilienankauf & Sanierung</div>
    </div>
    <div class="bottom-bar">
      <div class="logo"><img src="logo.png" alt="A&A Assets"></div>
    </div>
  </div>
</body>
</html>
