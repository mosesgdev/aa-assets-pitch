<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .cover {
    width: 1080px; height: 1920px; background: #0a0f1a;
    position: relative; overflow: hidden; font-family: 'Montserrat', sans-serif;
    display: flex; flex-direction: column; justify-content: flex-end; padding: 80px;
  }
  .bg { position: absolute; inset: 0; }
  .bg img { width: 100%; height: 100%; object-fit: cover; opacity: 0.3; }
  .bg-gradient { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,15,26,0.2) 0%, rgba(10,15,26,0.5) 50%, #0a0f1a 80%); }
  .content { position: relative; z-index: 2; }
  .badge { display: inline-block; background: #d4a853; color: #0a0f1a; font-size: 11px; text-transform: uppercase; letter-spacing: 0.25em; font-weight: 700; padding: 12px 22px; margin-bottom: 24px; }
  .title { font-family: 'Instrument Serif', serif; font-size: 56px; color: #ffffff; line-height: 1.1; margin-bottom: 20px; }
  .subtitle { font-size: 18px; color: rgba(255,255,255,0.45); line-height: 1.6; max-width: 700px; margin-bottom: 40px; }
  .play-hint { display: flex; align-items: center; gap: 14px; color: #d4a853; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.15em; }
  .play-square { width: 48px; height: 48px; border: 2px solid #d4a853; display: flex; align-items: center; justify-content: center; }
  .play-triangle { width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 14px solid #d4a853; margin-left: 3px; }
  .top-logo { position: absolute; top: 60px; left: 80px; z-index: 5; display: flex; align-items: center; gap: 10px; }
  .top-logo img { width: 100px; height: 100px; object-fit: contain; }
  .logo-text { color: #ffffff; font-family: 'Instrument Serif', serif; font-size: 19px; }
</style>
</head>
<body>
  <div class="cover">
    <div class="bg">
      <img src="https://aa-assets.de/wp-content/uploads/2024/12/20240830_142954-scaled.jpg" alt="">
    </div>
    <div class="bg-gradient"></div>
    <div class="top-logo">
      <img src="logo.png" alt="A&A Assets">
    </div>
    <div class="content">
      <div class="badge">Vorher / Nachher</div>
      <div class="title">Sanierung in<br>Düsseldorf Stadtmitte</div>
      <div class="subtitle">92m² Wohnung komplett verwandelt — vom Sanierungsfall zum Traumzuhause</div>
      <div class="play-hint">
        <div class="play-square"><div class="play-triangle"></div></div>
        Video ansehen
      </div>
    </div>
  </div>
</body>
</html>
