<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .post {
    width: 1080px;
    height: 1350px;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    flex-direction: column;
  }

  .image-area { height: 55%; position: relative; overflow: hidden; }
  .image-area img { width: 100%; height: 100%; object-fit: cover; }
  .image-area::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,255,255,0), #ffffff); }

  .content {
    flex: 1;
    padding: 40px 50px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    z-index: 2;
  }

  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.3em; color: #d4a853; font-weight: 700; margin-bottom: 14px; }
  .title { font-family: 'Instrument Serif', serif; font-size: 48px; color: #0a0f1a; line-height: 1.1; }

  .stats { display: flex; gap: 48px; margin-top: auto; }
  .stat-value { font-size: 28px; font-weight: 600; color: #0a0f1a; font-family: 'Instrument Serif', serif; }
  .stat-label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.15em; margin-top: 4px; }

  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 50px 44px;
    position: relative;
    z-index: 2;
  }

  .logo img { width: 120px; height: 120px; object-fit: contain; }

  .location { display: flex; align-items: center; gap: 8px; color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; }
  .location-dot { width: 6px; height: 6px; background: #d4a853; }

  .gold-line { position: absolute; top: 55%; left: 50px; width: 60px; height: 2px; background: #d4a853; z-index: 5; transform: translateY(-50%); }
</style>
</head>
<body>
  <div class="post">
    <div class="image-area">
      <img src="https://aa-assets.de/wp-content/uploads/2022/09/WhatsApp-Image-2022-09-23-at-13.12.32.jpeg" alt="Einfamilienhaus Neuss">
    </div>
    <div class="gold-line"></div>
    <div class="content">
      <div>
        <div class="eyebrow">Projekt-Spotlight</div>
        <div class="title">Einfamilienhaus in Neuss</div>
      </div>
      <div class="stats">
        <div><div class="stat-value">EFH</div><div class="stat-label">Typ</div></div>
        <div><div class="stat-value">Komplett</div><div class="stat-label">Kernsanierung</div></div>
        <div><div class="stat-value">Neuss</div><div class="stat-label">Standort</div></div>
      </div>
    </div>
    <div class="bottom-bar">
      <div class="logo"><img src="logo.png" alt="A&A Assets"></div>
      <div class="location"><div class="location-dot"></div>NRW, Deutschland</div>
    </div>
  </div>
</body>
</html>
